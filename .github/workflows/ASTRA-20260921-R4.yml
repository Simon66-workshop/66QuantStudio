name: Astra R4 focused delivery proof
on:
  push:
    branches: [audit/astra-20260921-r4]
    paths: [.github/workflows/ASTRA-20260921-R4.yml]
permissions:
  contents: read
  actions: read
jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: astra-20260921-r4-closure
          run-id: 35628912163
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/astra-r4-input
      - name: Restore identical installed candidate; correct audit assertion only
        run: |
          mkdir -p "$RUNNER_TEMP/astra-r4-proof/evidence"
          cd "$RUNNER_TEMP/astra-r4-proof"
          tar -xzf "$RUNNER_TEMP/astra-r4-input/audited-workspace.tar.gz"
          cp "$RUNNER_TEMP/astra-r4-input/evidence/r4-browser.py" evidence/
          python - <<'PY'
          from pathlib import Path
          p=Path('evidence/r4-browser.py')
          s=p.read_text()
          old="assert page.title()=='66QuantStudio',page.title()"
          new="assert page.title()=='66QuantStudio · Quant · Work · Trade',page.title()"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          cd repo
          grep -v ' apps/web/package-lock.json$' "$RUNNER_TEMP/astra-r4-input/evidence/tracked-source.sha256" | sha256sum -c > ../evidence/source-verification.txt
          cp "$RUNNER_TEMP/astra-r4-input/evidence/base-sha.txt" ../evidence/
      - name: Audit-only browser and Chinese fonts
        run: |
          cd "$RUNNER_TEMP/astra-r4-proof"
          python -m pip install playwright==1.55.0 > evidence/browser-install.log 2>&1
          sudo apt-get update -qq > evidence/font-install.log 2>&1
          sudo apt-get install -y fonts-noto-cjk >> evidence/font-install.log 2>&1
          { uname -a; node -v; npm -v; date -u +%FT%TZ; } > evidence/environment.txt
      - name: Real browser proof without product changes
        env:
          BASE_SHA: d8949011a6e754e122ebe2d610d6588520de73d0
        run: |
          cd "$RUNNER_TEMP/astra-r4-proof"
          export QS_ROOT="$PWD/repo" OUT="$PWD/evidence"
          set +e
          python evidence/r4-browser.py > evidence/browser.log 2>&1
          CODE=$?; echo "$CODE" > evidence/browser.exit
          cat evidence/browser.log
          exit "$CODE"
      - name: Evidence hashes
        if: always()
        run: |
          cd "$RUNNER_TEMP/astra-r4-proof/evidence"
          find . -type f ! -name SHA256SUMS ! -path '*__pycache__*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-20260921-r4-proof
          path: ${{ runner.temp }}/astra-r4-proof/evidence/
          retention-days: 90
