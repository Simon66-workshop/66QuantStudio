name: Astra R3 independent browser and engine regression
on:
  push:
    branches: [audit/astra-20260921-r3]
    paths: [.github/workflows/ASTRA-20260921-R3.yml]
permissions:
  contents: read
  actions: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: astra-20260921-r3-baseline
          run-id: 35621474346
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r3
      - name: Restore verified isolated baseline and audit harnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/r3"
          sha256sum -c evidence/workspace.sha256
          tar -xzf audited-workspace.tar.gz
          mkdir -p verification
          python - <<'PY'
          import urllib.request,json,base64,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r3'/'verification'
          for name,sha in [('browser.py','67d11c2b643fbe219dc2abde72d45b7d4bfb53f4'),('engine.mjs','6ae3ec283fbd7d05287ac4376db9cc65dee25baf')]:
              req=urllib.request.Request('https://api.github.com/repos/Simon66-workshop/66QuantStudio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              obj=json.load(urllib.request.urlopen(req));data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              (root/name).write_bytes(data)
          PY
          python -m pip install playwright==1.55.0 > verification/playwright-install.log 2>&1
          python -m py_compile verification/browser.py
          node --check verification/engine.mjs
      - name: Execute independent engine and real Chrome tests
        run: |
          cd "$RUNNER_TEMP/r3"
          export QS_ROOT="$PWD/66QuantStudio"
          export OUT="$PWD/verification"
          node verification/engine.mjs > verification/engine.log 2>&1
          cd 66QuantStudio
          env -u QS_ORIGINS -u QS_ALLOW_DEV_ORIGINS HOST=127.0.0.1 PORT=3198 npm start > ../verification/npm-start.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3198/api/health > ../verification/health.json && break
            sleep 1
          done
          cd ..
          python verification/browser.py > verification/browser.log 2>&1
          test -s verification/browser-results.json
          test -s verification/engine-results.json
          { node -v; npm -v; google-chrome --version; date -u +%FT%TZ; } > verification/environment.txt
          cd verification
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-20260921-r3-regressions
          path: ${{ runner.temp }}/r3/verification/
          retention-days: 90
