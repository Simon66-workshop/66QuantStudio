name: Astra R3 publish independently verified reports
on:
  push:
    branches: [audit/astra-20260921-r3]
    paths: [.github/workflows/ASTRA-20260921-R3.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/astra-20260921-r3
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: astra-20260921-r3-baseline
          run-id: 35621474346
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r3-report-evidence/A
      - uses: actions/download-artifact@v4
        with:
          name: astra-20260921-r3-regressions
          run-id: 35622977284
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r3-report-evidence/B
      - uses: actions/download-artifact@v4
        with:
          name: astra-20260921-r3-focused
          run-id: 35623565108
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r3-report-evidence/C
      - name: Verify evidence and generate synchronized documents
        env:
          GH_TOKEN: ${{ github.token }}
          QS_ROOT: ${{ github.workspace }}
          AUDIT_EVIDENCE: ${{ runner.temp }}/r3-report-evidence
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = 6ab0cf4ccddd9515f5cc93d51296ad41a1fa4f29
          python - <<'PY'
          import os,json,base64,hashlib,urllib.request,pathlib,tarfile
          e=pathlib.Path(os.environ['AUDIT_EVIDENCE']);root=pathlib.Path(os.environ['QS_ROOT'])
          sha='ceba35964dde1a453842af82d09dfccaf051b250'
          req=urllib.request.Request('https://api.github.com/repos/Simon66-workshop/66QuantStudio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          obj=json.load(urllib.request.urlopen(req));data=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          (e/'generate.py').write_bytes(data)
          with tarfile.open(e/'A/audited-workspace.tar.gz') as t:
              t.extractall(e, members=[m for m in t.getmembers() if m.name.startswith('mosha-card-ui/')],filter='data')
          rows=[]
          for p in sorted((root/'apps/web/src/mosha').iterdir()):
              q=e/'mosha-card-ui'/('css/mosha-card.css' if p.name=='mosha-card.css' else 'src/lib/mosha/'+p.name)
              assert p.read_bytes()==q.read_bytes(),p.name
              rows.append({'file':str(p.relative_to(root)),'reference':str(q.relative_to(e/'mosha-card-ui')),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert len(rows)==8
          (e/'mosha-comparison.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          python -m py_compile "$AUDIT_EVIDENCE/generate.py"
          python "$AUDIT_EVIDENCE/generate.py"
      - name: Commit and push only the two audit reports
        run: |
          git rm .github/workflows/ASTRA-20260921-R3.yml
          git add docs/audits/astra-20260921-r3.md docs/audits/astra-20260921-r3.json
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','6ab0cf4ccddd9515f5cc93d51296ad41a1fa4f29'],text=True).splitlines()
          assert sorted(files)==['docs/audits/astra-20260921-r3.json','docs/audits/astra-20260921-r3.md'],files
          PY
          git diff --check --cached
          git config user.name 'Astra audit (GitHub Actions)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(astra): 2026-09-21 全量审计'
          git push origin HEAD:audit/astra-20260921-r3
          mkdir -p "$RUNNER_TEMP/r3-final"
          cp docs/audits/astra-20260921-r3.md docs/audits/astra-20260921-r3.json "$RUNNER_TEMP/r3-final/"
          cp "$RUNNER_TEMP/r3-report-evidence/report-validation.json" "$RUNNER_TEMP/r3-report-evidence/independent-numerics.json" "$RUNNER_TEMP/r3-report-evidence/mosha-comparison.json" "$RUNNER_TEMP/r3-report-evidence/generate.py" "$RUNNER_TEMP/r3-final/"
          git rev-parse HEAD > "$RUNNER_TEMP/r3-final/commit.txt"
          git diff --stat 6ab0cf4ccddd9515f5cc93d51296ad41a1fa4f29 HEAD > "$RUNNER_TEMP/r3-final/final-diff-stat.txt"
          git status --short > "$RUNNER_TEMP/r3-final/git-status.txt"
          cd "$RUNNER_TEMP/r3-final"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-20260921-r3-final-reports
          path: ${{ runner.temp }}/r3-final/
          retention-days: 90
