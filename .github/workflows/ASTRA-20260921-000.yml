name: Astra isolated baseline verification
on:
  push:
    branches: [audit/astra-20260921]
    paths: [.github/workflows/ASTRA-20260921-000.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Clone frozen product and design reference
        run: |
          mkdir -p "$RUNNER_TEMP/astra/evidence"
          cd "$RUNNER_TEMP/astra"
          git clone https://github.com/Simon66-workshop/66QuantStudio.git
          cd 66QuantStudio
          git show 907766faa721c9adee212bcc454ded9a851e44fa:docs/audits/ASTRA-20260921-000.mjs > ../ui-audit.mjs
          git checkout --detach ac3b8915488da0664d78a4b19afb262636735bbe
          git rev-parse HEAD > ../evidence/base-sha.txt
          cd ..
          git clone https://github.com/Simon66-workshop/mosha-card-ui.git
          git -C mosha-card-ui checkout --detach 7abd3b0b811f483f8d172f15e843836496824b3f
          git -C mosha-card-ui rev-parse HEAD > evidence/mosha-sha.txt
      - name: Install test and build unmodified product
        run: |
          cd "$RUNNER_TEMP/astra/66QuantStudio"
          { uname -a; node --version; npm --version; date -u +%FT%TZ; } > ../evidence/environment.txt
          npm install > ../evidence/npm-install.log 2>&1
          npm test > ../evidence/npm-test.log 2>&1
          npm run build > ../evidence/npm-build.log 2>&1
      - name: Prepare isolated browser with Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/astra/browser"
          npm install --prefix "$RUNNER_TEMP/astra/browser" playwright@1.55.1
      - name: Browser follow-up and independent engine edge tests
        run: |
          cd "$RUNNER_TEMP/astra/66QuantStudio"
          mv server/runtime ../runtime-after-unit-tests
          npm start > ../evidence/npm-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3198/api/health > ../evidence/health.json && break
            sleep 1
          done
          export ASTRA_PLAYWRIGHT="$RUNNER_TEMP/astra/browser/node_modules/playwright/index.mjs"
          export ASTRA_OUT="$RUNNER_TEMP/astra/evidence"
          node "$RUNNER_TEMP/astra/ui-audit.mjs" > ../evidence/followup-harness.log 2>&1
      - name: Hash evidence
        if: always()
        run: |
          cd "$RUNNER_TEMP/astra/evidence"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-20260921-followup
          path: ${{ runner.temp }}/astra/evidence/
          retention-days: 30
