name: Astra isolated baseline verification
on:
  push:
    branches: [audit/astra-20260921]
    paths: [.github/workflows/ASTRA-20260921-000.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Clone exact audit baseline and design reference
        run: |
          mkdir -p "$RUNNER_TEMP/astra/evidence"
          cd "$RUNNER_TEMP/astra"
          git clone https://github.com/Simon66-workshop/66QuantStudio.git
          cd 66QuantStudio
          git checkout --detach ac3b8915488da0664d78a4b19afb262636735bbe
          git bundle create ../evidence/66QuantStudio.bundle HEAD
          git rev-parse HEAD > ../evidence/base-sha.txt
          cd ..
          git clone --depth 1 https://github.com/Simon66-workshop/mosha-card-ui.git
          git -C mosha-card-ui rev-parse HEAD > evidence/mosha-sha.txt
      - name: Run exact install test and build commands
        run: |
          cd "$RUNNER_TEMP/astra/66QuantStudio"
          set +e
          { uname -a; node --version; npm --version; date -u +%FT%TZ; } > ../evidence/environment.txt
          npm install > ../evidence/npm-install.log 2>&1
          echo "$?" > ../evidence/npm-install.exit
          npm test > ../evidence/npm-test.log 2>&1
          echo "$?" > ../evidence/npm-test.exit
          npm run build > ../evidence/npm-build.log 2>&1
          echo "$?" > ../evidence/npm-build.exit
          npm audit --json > ../evidence/npm-audit-root.json 2>&1
          npm audit --prefix apps/web --json > ../evidence/npm-audit-web.json 2>&1
          git status --short > ../evidence/install-working-tree.txt
          exit 0
      - name: Start baseline on requested localhost and collect first viewport
        run: |
          cd "$RUNNER_TEMP/astra/66QuantStudio"
          npm start > ../evidence/npm-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3198/api/health > ../evidence/health.json && break
            sleep 1
          done
          curl -sS -D ../evidence/home-headers.txt http://127.0.0.1:3198/ > ../evidence/home.html
          cd "$RUNNER_TEMP/astra"
          npx --yes --package @playwright/test@1.55.1 playwright screenshot --channel chrome --viewport-size '1440,1000' --wait-for-timeout 2000 http://127.0.0.1:3198/ evidence/home-first.png > evidence/browser-first.log 2>&1 || true
      - name: Package baseline and dependencies for independent interactive audit
        if: always()
        run: |
          cd "$RUNNER_TEMP/astra"
          tar --exclude='*/.git' --exclude='*/server/runtime' --exclude='*/.env' -czf audited-workspace.tar.gz 66QuantStudio mosha-card-ui
          sha256sum audited-workspace.tar.gz > evidence/workspace.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-20260921-baseline
          path: |
            ${{ runner.temp }}/astra/audited-workspace.tar.gz
            ${{ runner.temp }}/astra/evidence/
          retention-days: 2
